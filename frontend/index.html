<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milestone Cart App</title>
    <!--
      App Bridge React v4 — must be loaded before the React bundle.
      apiKey is baked in at build time via VITE_SHOPIFY_API_KEY.
      The 'host' query param is automatically appended by Shopify when loading the embedded app.
    -->
    <script>
      // Expose the Shopify API key globally so App Bridge can pick it up
      window.__SHOPIFY_API_KEY__ = "%VITE_SHOPIFY_API_KEY%";
    </script>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"
      data-api-key="%VITE_SHOPIFY_API_KEY%">
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
